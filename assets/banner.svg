<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: url(#text-grad); }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    /* Dynamic background animations placed safely in background layer */
    .bg-node { animation: float 6s ease-in-out infinite alternate; }
    .bg-line { stroke-dasharray: 8 8; animation: dash 20s linear infinite; }
    .pulse-circle { animation: pulse 3s ease-in-out infinite; }
    
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-15px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="16"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- Dynamic / Animated Background Graphics Layer (Behind Text) -->
  <g opacity="0.25">
    <line x1="100" y1="50" x2="300" y2="250" stroke="#38bdf8" stroke-width="1.5" class="bg-line"/>
    <line x1="300" y1="250" x2="600" y2="80" stroke="#818cf8" stroke-width="1.5" class="bg-line"/>
    <line x1="600" y1="80" x2="900" y2="220" stroke="#c084fc" stroke-width="1.5" class="bg-line"/>
    <line x1="900" y1="220" x2="1100" y2="60" stroke="#38bdf8" stroke-width="1.5" class="bg-line"/>
    
    <circle cx="100" cy="50" r="8" fill="#38bdf8" class="bg-node"/>
    <circle cx="300" cy="250" r="12" fill="#818cf8" class="bg-node"/>
    <circle cx="600" cy="80" r="10" fill="#c084fc" class="bg-node"/>
    <circle cx="900" cy="220" r="14" fill="#38bdf8" class="bg-node"/>
    <circle cx="1100" cy="60" r="8" fill="#818cf8" class="bg-node"/>
  </g>

  <!-- Foreground Content Layer (Text & Labels ALWAYS on Top) -->
  <g transform="translate(60, 110)">
    <!-- Icon/Graphic -->
    <g transform="translate(0, -25)">
      <rect x="0" y="0" width="64" height="64" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
      <path d="M20 44 L32 20 L44 44 M26 36 L38 36" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="44" cy="44" r="8" fill="#c084fc" stroke="#1e293b" stroke-width="2"/>
    </g>

    <!-- Main Title & Subtitle -->
    <text x="84" y="15" class="title">Awesome Computer-Aided Investigation</text>
    <text x="84" y="48" class="subtitle">Curated SaaS Platforms, DFIR Tools, OSINT & Investigative Intelligence Solutions</text>

    <!-- Feature Tags / Pills (Foreground) -->
    <g transform="translate(84, 75)">
      <rect x="0" y="0" width="160" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="80" y="18" text-anchor="middle" class="badge-text">🔍 Case Management</text>

      <rect x="175" y="0" width="140" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
      <text x="245" y="18" text-anchor="middle" class="badge-text">🔗 Link Analysis</text>

      <rect x="330" y="0" width="150" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="405" y="18" text-anchor="middle" class="badge-text">💻 Digital Forensics</text>

      <rect x="495" y="0" width="120" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
      <text x="555" y="18" text-anchor="middle" class="badge-text">🌐 OSINT</text>
    </g>
  </g>
</svg>
